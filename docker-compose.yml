# Local development dependencies only. Nothing here is used in production —
# Railway supplies Postgres, and S3/R2 supplies object storage.

services:
  postgres:
    image: postgres:16-alpine
    container_name: presenter-ops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: presenter
      POSTGRES_PASSWORD: presenter
      POSTGRES_DB: presenter_ops
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U presenter -d presenter_ops']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for local script uploads, so you do not need a real
  # bucket to develop against. Console at http://localhost:9001.
  minio:
    image: minio/minio:latest
    container_name: presenter-ops-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  # Creates the bucket on first boot and exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      mc mb --ignore-existing local/presenter-ops;
      mc anonymous set none local/presenter-ops;
      exit 0;
      "

volumes:
  postgres-data:
  minio-data:
