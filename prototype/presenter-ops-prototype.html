<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PresenterOps — interactive prototype</title>
<style>
/* ===========================================================================
   PresenterOps — clickable prototype
   ---------------------------------------------------------------------------
   Single file, no build step, no network. Everything below mirrors the design
   tokens in apps/web/src/styles/globals.css and the screens in apps/web/src/app,
   so what you sign off here is what the developer builds.

   The data is invented for demonstration. Nothing here is real.
   =========================================================================== */

:root{
  --background:0 0% 100%; --foreground:222 47% 11%;
  --card:0 0% 100%; --canvas:220 20% 97%;
  --primary:221 83% 53%; --primary-fg:210 40% 98%;
  --secondary:220 14% 96%; --muted:220 14% 96%; --muted-fg:220 9% 46%;
  --success:142 71% 36%; --warning:38 92% 45%; --destructive:0 72% 51%; --info:199 89% 44%;
  --border:220 13% 91%; --input:220 13% 91%; --ring:221 83% 53%;
  --radius:.625rem;
  --shadow-sm:0 1px 2px 0 hsl(222 47% 11%/.05);
  --shadow-md:0 1px 3px 0 hsl(222 47% 11%/.07),0 1px 2px -1px hsl(222 47% 11%/.06);
  --shadow-lg:0 8px 24px -6px hsl(222 47% 11%/.12),0 2px 6px -2px hsl(222 47% 11%/.06);
}
[data-theme="dark"]{
  --background:224 30% 8%; --foreground:210 40% 96%;
  --card:224 26% 11%; --canvas:224 32% 6%;
  --primary:217 91% 60%; --primary-fg:224 30% 8%;
  --secondary:223 20% 17%; --muted:223 20% 17%; --muted-fg:218 11% 65%;
  --success:142 60% 45%; --warning:38 92% 55%; --destructive:0 72% 58%; --info:199 89% 55%;
  --border:223 18% 20%; --input:223 18% 22%; --ring:217 91% 60%;
  --shadow-sm:0 1px 2px 0 hsl(0 0% 0%/.3);
  --shadow-md:0 1px 3px 0 hsl(0 0% 0%/.4);
  --shadow-lg:0 8px 24px -6px hsl(0 0% 0%/.5);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:hsl(var(--canvas)); color:hsl(var(--foreground));
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.tabular{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* --- layout --------------------------------------------------------------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:232px;flex-shrink:0;background:hsl(var(--background));
  border-right:1px solid hsl(var(--border));position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:8px;height:56px;padding:0 16px;border-bottom:1px solid hsl(var(--border))}
.brand-mark{width:28px;height:28px;border-radius:6px;background:hsl(var(--primary));color:hsl(var(--primary-fg));
  display:grid;place-items:center;font-size:11px;font-weight:700}
.nav{padding:12px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{
  display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;
  color:hsl(var(--muted-fg));text-decoration:none;font-weight:500;font-size:13px;
  transition:background .12s,color .12s;
}
.nav a:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}
.nav a.active{background:hsl(var(--primary)/.1);color:hsl(var(--primary))}
.nav svg{width:16px;height:16px;flex-shrink:0}
.search-btn{margin:12px;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid hsl(var(--border));
  border-radius:6px;background:none;color:hsl(var(--muted-fg));font:inherit;font-size:13px;cursor:pointer;width:calc(100% - 24px)}
.search-btn:hover{background:hsl(var(--muted))}
kbd{border:1px solid hsl(var(--border));background:hsl(var(--muted));border-radius:4px;padding:1px 5px;
  font-family:ui-monospace,monospace;font-size:10px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;
  background:hsl(var(--background)/.85);backdrop-filter:blur(8px);border-bottom:1px solid hsl(var(--border));
}
.content{padding:24px;max-width:1500px;width:100%}

/* --- primitives ----------------------------------------------------------- */
.card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:12px;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 20px 10px}
.card-head h3{font-size:15px;font-weight:600}
.card-head p{font-size:13px;color:hsl(var(--muted-fg));margin-top:2px}
.card-body{padding:0 20px 18px}
.card-body.flush{padding:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;
  border-radius:6px;border:1px solid transparent;font:inherit;font-size:13px;font-weight:500;cursor:pointer;
  transition:background .12s,box-shadow .12s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primary{background:hsl(var(--primary));color:hsl(var(--primary-fg));box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:hsl(var(--primary)/.9)}
.btn-outline{border-color:hsl(var(--border));background:hsl(var(--background));color:hsl(var(--foreground))}
.btn-outline:hover{background:hsl(var(--muted))}
.btn-ghost{background:none;color:hsl(var(--muted-fg))}
.btn-ghost:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}
.btn-success{background:hsl(var(--success));color:#fff}
.btn-danger{background:hsl(var(--destructive));color:#fff}
.btn-sm{height:30px;padding:0 11px;font-size:12px}
.btn-icon{width:36px;padding:0}
.btn:disabled{opacity:.5;cursor:not-allowed}

.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:500;
  background:hsl(var(--secondary));color:hsl(var(--foreground))}
.badge-primary{background:hsl(var(--primary)/.12);color:hsl(var(--primary))}
.badge-success{background:hsl(var(--success)/.12);color:hsl(var(--success))}
.badge-warning{background:hsl(var(--warning)/.14);color:hsl(var(--warning))}
.badge-danger{background:hsl(var(--destructive)/.12);color:hsl(var(--destructive))}
.badge-info{background:hsl(var(--info)/.12);color:hsl(var(--info))}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:500}

input,select,textarea{
  width:100%;height:36px;border:1px solid hsl(var(--input));border-radius:6px;background:hsl(var(--background));
  color:hsl(var(--foreground));padding:0 11px;font:inherit;font-size:13px;box-shadow:var(--shadow-sm)}
textarea{height:auto;padding:9px 11px;resize:vertical}
input::placeholder,textarea::placeholder{color:hsl(var(--muted-fg))}
label.field{display:block;margin-bottom:14px}
label.field>span.lbl{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
label.field .opt{font-weight:400;color:hsl(var(--muted-fg));font-size:11px;margin-left:6px}
label.field .hint{display:block;font-size:11px;color:hsl(var(--muted-fg));margin-top:5px}
.req{color:hsl(var(--destructive))}

.avatar{border-radius:999px;display:grid;place-items:center;background:hsl(var(--muted));
  color:hsl(var(--muted-fg));font-weight:600;flex-shrink:0;overflow:hidden}
.avatar.xs{width:24px;height:24px;font-size:9px}
.avatar.sm{width:32px;height:32px;font-size:11px}
.avatar.md{width:40px;height:40px;font-size:12px}
.avatar.lg{width:56px;height:56px;font-size:15px}
.avatar.xl{width:80px;height:80px;font-size:22px}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:500;
  color:hsl(var(--muted-fg));padding:10px 16px;background:hsl(var(--muted)/.45);border-bottom:1px solid hsl(var(--border))}
tbody td{padding:11px 16px;border-bottom:1px solid hsl(var(--border))}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:hsl(var(--muted)/.4)}
.num{text-align:right}

.page-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-head h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.page-head p{font-size:13px;color:hsl(var(--muted-fg));margin-top:3px}
.crumb{font-size:11px;color:hsl(var(--muted-fg));margin-bottom:5px}
.crumb a{color:inherit}

.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:12px;padding:14px 16px;
  box-shadow:var(--shadow-sm);position:relative;cursor:help}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:hsl(var(--muted-fg));font-weight:500}
.stat .v{font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.stat .s{font-size:11px;color:hsl(var(--muted-fg));margin-top:2px}
.stat.good .v{color:hsl(var(--success))}
.stat.warn .v{color:hsl(var(--warning))}
.stat.bad .v{color:hsl(var(--destructive))}

/* tooltips: pure CSS so the prototype needs no library */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:0;z-index:60;
  background:hsl(var(--foreground));color:hsl(var(--background));padding:7px 10px;border-radius:6px;
  font-size:11.5px;font-weight:400;line-height:1.4;width:max-content;max-width:290px;
  box-shadow:var(--shadow-lg);white-space:normal;text-transform:none;letter-spacing:0;
}

.row{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid hsl(var(--border));
  text-decoration:none;color:inherit;transition:background .12s}
.row:last-child{border-bottom:none}
.row:hover{background:hsl(var(--muted)/.5)}
.muted{color:hsl(var(--muted-fg))}
.small{font-size:11.5px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.tabs{display:flex;gap:2px;border-bottom:1px solid hsl(var(--border));margin-bottom:18px}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:9px 12px;font:inherit;
  font-size:13px;font-weight:500;color:hsl(var(--muted-fg));cursor:pointer;margin-bottom:-1px}
.tabs button:hover{color:hsl(var(--foreground))}
.tabs button.active{border-bottom-color:hsl(var(--primary));color:hsl(var(--foreground))}

.empty{border:1px dashed hsl(var(--border));border-radius:12px;padding:48px 24px;text-align:center}
.empty h4{font-size:15px;font-weight:600}
.empty p{font-size:13px;color:hsl(var(--muted-fg));margin-top:4px;max-width:380px;margin-inline:auto}

/* --- board ---------------------------------------------------------------- */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.col-head{display:flex;align-items:center;gap:8px;padding:0 4px;margin-bottom:6px}
.col-head h2{font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:999px}
.job{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:10px;padding:12px;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .12s;margin-bottom:8px;display:block;
  text-align:left;width:100%;font:inherit;color:inherit}
.job:hover{box-shadow:var(--shadow-md)}
.job h4{font-size:13px;font-weight:500;margin:4px 0 0;line-height:1.35}

/* --- workload bar --------------------------------------------------------- */
.bar{position:relative;height:8px;border-radius:999px;background:hsl(var(--muted));overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;border-radius:999px;transition:width .3s}
.bar .mark{position:absolute;top:0;bottom:0;left:50%;width:1px;background:hsl(var(--foreground)/.4)}

/* --- combobox ------------------------------------------------------------- */
.combo{position:relative}
.combo-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;height:36px;
  border:1px solid hsl(var(--input));border-radius:6px;background:hsl(var(--background));padding:0 11px;
  font:inherit;font-size:13px;cursor:pointer;width:100%;color:inherit;box-shadow:var(--shadow-sm)}
.combo-pop{position:absolute;z-index:50;top:calc(100% + 4px);left:0;right:0;background:hsl(var(--card));
  border:1px solid hsl(var(--border));border-radius:10px;box-shadow:var(--shadow-lg);overflow:hidden}
.combo-pop input{border:none;border-bottom:1px solid hsl(var(--border));border-radius:0;box-shadow:none;height:40px}
.combo-list{max-height:230px;overflow-y:auto;padding:4px}
.combo-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:13px}
.combo-item:hover,.combo-item.hl{background:hsl(var(--muted))}
.combo-note{padding:6px 9px;font-size:11px;color:hsl(var(--muted-fg))}

/* --- palette -------------------------------------------------------------- */
.overlay{position:fixed;inset:0;background:hsl(var(--foreground)/.3);backdrop-filter:blur(3px);z-index:80;display:none}
.overlay.open{display:block}
.palette{position:fixed;top:96px;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));
  background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:12px;box-shadow:var(--shadow-lg);
  z-index:81;display:none;overflow:hidden}
.palette.open{display:block}
.palette input{border:none;border-bottom:1px solid hsl(var(--border));border-radius:0;height:48px;box-shadow:none;font-size:14px}
.palette-list{max-height:320px;overflow-y:auto;padding:6px}
.palette-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:hsl(var(--muted-fg));padding:8px 9px 4px}
.palette-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:6px;cursor:pointer;font-size:13px}
.palette-item:hover,.palette-item.hl{background:hsl(var(--muted))}

.banner{background:hsl(var(--primary)/.08);border-bottom:1px solid hsl(var(--primary)/.2);
  padding:9px 20px;font-size:12px;color:hsl(var(--primary));display:flex;gap:10px;align-items:center;justify-content:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media(max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.sidebar{display:none}.board{grid-template-columns:1fr}.content{padding:16px}}
</style>
</head>
<body>

<div class="banner">
  <strong>Interactive prototype</strong>
  <span>Click anything. Press <kbd>⌘K</kbd> or <kbd>/</kbd> to search. All data below is invented for demonstration.</span>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">

    </div>
    <nav class="nav" id="nav" aria-label="Main"></nav>

      <span style="flex:1;text-align:left">Search</span><kbd>⌘K</kbd>
    </button>

  <div class="main">
    <header class="topbar">
      <div style="flex:1"></div>
      <button class="btn btn-primary btn-sm" onclick="go('assignment-new')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        New assignment
      </button>
      <button class="btn btn-ghost btn-icon" onclick="toggleTheme()" aria-label="Toggle dark mode" id="themeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
      <div style="display:flex;align-items:center;gap:8px;border-left:1px solid hsl(var(--border));padding-left:12px">
        <div class="avatar sm">JP</div>
        <div style="line-height:1.25">
          <div style="font-size:12px;font-weight:500">Jo Producer</div>
          <div class="small muted">Producer</div>
        </div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closePalette()"></div>
<div class="palette" id="palette" role="dialog" aria-label="Search and commands">
  <input id="paletteInput" placeholder="Search presenters and work, or jump to a screen…" autocomplete="off" />
  <div class="palette-list" id="paletteList"></div>
</div>

<script>

  SUBMITTED:'Submitted', IN_REVIEW:'In review', REVISIONS_REQUESTED:'Revisions requested',

const STATUS_CLASS = {
  DRAFT:'badge', ASSIGNED:'badge badge-info', ACCEPTED:'badge badge-info', IN_PROGRESS:'badge badge-primary',
  SUBMITTED:'badge badge-warning', IN_REVIEW:'badge badge-warning', REVISIONS_REQUESTED:'badge badge-danger',
  APPROVED:'badge badge-success', COMPLETED:'badge badge-success', DECLINED:'badge', CANCELLED:'badge',
};

/* --- helpers -------------------------------------------------------------- */
const brand = id => BRANDS.find(b => b.id === id);
const presenter = id => PRESENTERS.find(p => p.id === id);
const initials = n => n.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
const money = (minor, compact) => minor == null ? '—'
  : new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',
      notation:compact?'compact':'standard',maximumFractionDigits:compact?1:2,minimumFractionDigits:compact?0:2}).format(minor/100);

// Readable text on a brand colour, via WCAG relative luminance.
function textOn(hex){
  const c = hex.replace('#','');
  const [r,g,b] = [0,2,4].map(i => parseInt(c.substr(i,2),16)/255);
  const ch = v => v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4);
  return (.2126*ch(r)+.7152*ch(g)+.0722*ch(b)) > .179 ? '#000' : '#fff';
}
const chip = b => `<span class="chip" style="background:${b.color};color:${textOn(b.color)}">${b.name}</span>`;
const avatar = (name, size='sm') => `<div class="avatar ${size}">${initials(name)}</div>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dueLabel(due, status){
  const days = parseInt(due,10);
  const closed = ['COMPLETED','APPROVED','CANCELLED','DECLINED'].includes(status);
  if (closed) return `<span class="small muted">delivered</span>`;
  if (days < 0) return `<span class="small" style="color:hsl(var(--destructive));font-weight:500">${Math.abs(days)}d overdue</span>`;
  if (days <= 2) return `<span class="small" style="color:hsl(var(--warning));font-weight:500">due in ${days}d</span>`;
  return `<span class="small muted">due in ${days}d</span>`;
}

   =========================================================================== */
let route = 'dashboard', param = null;
const state = { presenterView:'cards', workView:'board', tab:'work', jobTab:'brief', jobStatus:{}, wlDays:30 };

function go(r, p){ route = r; param = p ?? null; window.scrollTo(0,0); render(); }

// Which nav item lights up for each route. An explicit map rather than a
// prefix test, because 'workload' starts with 'work' and prefix matching
// would highlight two items at once.
const NAV_FOR_ROUTE = {
  dashboard:'dashboard',
  work:'work', assignment:'work', 'assignment-new':'work',
  presenters:'presenters', presenter:'presenters', 'presenter-new':'presenters',
  workload:'workload', portal:'portal',
};

function renderNav(){
  const current = NAV_FOR_ROUTE[route];
  document.getElementById('nav').innerHTML = NAV.map(n => `
    <a href="#" onclick="go('${n.id}');return false" class="${current===n.id?'active':''}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="${n.icon}"/></svg>${n.label}
    </a>`).join('');
}

function render(){
  renderNav();
  const view = document.getElementById('view');
  const map = {
    dashboard: viewDashboard, work: viewWork, 'assignment': viewAssignment, 'assignment-new': viewAssignmentNew,
    presenters: viewPresenters, presenter: viewPresenter, 'presenter-new': viewPresenterNew,
    workload: viewWorkload, portal: viewPortal,
  };
  view.innerHTML = (map[route] || viewDashboard)();
}

}

/* ===========================================================================
   WORKLOAD BALANCE
   =========================================================================== */
function viewWorkload(){
  // Deliverables assigned in the last 30 days, per the demo data.
  const rows = [
    {id:'p1', delivered:13, weight:1,   earned:224000},
    {id:'p4', delivered:6,  weight:1,   earned:140000},
    {id:'p2', delivered:3,  weight:1,   earned:66000},
    {id:'p3', delivered:2,  weight:0.5, earned:18000},
    {id:'p5', delivered:1,  weight:1,   earned:26000},
    {id:'p6', delivered:0,  weight:1,   earned:0},
  ];
  const totalW = rows.reduce((s,r) => s + r.weight, 0);
  const totalD = rows.reduce((s,r) => s + r.delivered, 0);

  const computed = rows.map(r => {
    const expected = r.weight / totalW;
    const actual = totalD ? r.delivered / totalD : 0;
    const bi = totalD ? actual / expected : null;
    const status = bi === null ? 'NO_DATA' : bi < 0.8 ? 'UNDER' : bi > 1.25 ? 'OVER' : 'BALANCED';
    // Solving (delivered + x)/(total + x) = expected for x
    const toParity = Math.max(0, Math.ceil((expected*totalD - r.delivered)/(1-expected)));
    return {...r, expected, actual, bi, status, toParity};
  }).sort((a,b) => (a.bi??0) - (b.bi??0));

  // Gini of weight-adjusted output.
  const vals = rows.map(r => r.delivered / r.weight).sort((a,b) => a-b);
  const n = vals.length, sum = vals.reduce((s,v)=>s+v,0);
  let ws = 0; vals.forEach((v,i) => ws += (i+1)*v);
  const gini = sum ? Math.max(0, (2*ws)/(n*sum) - (n+1)/n) : null;

  const tone = {UNDER:'hsl(var(--warning))', OVER:'hsl(var(--info))', BALANCED:'hsl(var(--success))', NO_DATA:'hsl(var(--muted-fg)/.4)'};
  const label = {UNDER:['badge-warning','Under-allocated'], OVER:['badge-info','Over-allocated'],
                 BALANCED:['badge-success','Balanced'], NO_DATA:['badge','No work this period']};

  return `
  <div class="page-head">
    <div><h1>Workload balance</h1><p>Who is getting a fair share of the work, and who is being missed.</p></div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
    <div style="display:flex;border:1px solid hsl(var(--border));border-radius:6px;padding:2px">
      ${[30,90,182,365].map(d => `<button class="btn btn-sm ${state.wlDays===d?'btn-outline':'btn-ghost'}" onclick="state.wlDays=${d};render()">${d===30?'Last 30 days':d===90?'Last 90 days':d===182?'Last 6 months':'Last 12 months'}</button>`).join('')}
    </div>
    <select style="width:auto"><option>All brands</option>${BRANDS.map(b=>`<option>${b.name}</option>`).join('')}</select>
  </div>

  <div class="grid stats">
    ${stat('Deliverables', totalD, `across ${JOBS.length} assignments`,
      'Total videos handed out in this period, counting assignments that were not cancelled or declined. Counted from the date the work was ASSIGNED, because that is the moment we control.')}
    ${stat('Under-allocated', computed.filter(r=>r.status==='UNDER').length, 'below 0.80 balance index',
      'Presenters who received less than 80% of the share their capacity weight implies. Threshold configurable in Settings.','warn')}
    ${stat('Over-allocated', computed.filter(r=>r.status==='OVER').length, 'above 1.25 balance index',
      'Presenters who received more than 125% of their implied share. Often the first sign of a burnout risk or a single point of failure.','warn')}
    ${stat('Evenness', gini.toFixed(2), 'Gini coefficient',
      'Gini coefficient of weight-adjusted output. 0.00 means every presenter received exactly the share their capacity implies; 1.00 means one person received everything. Below 4 presenters this number is noisy and is labelled indicative only.', gini<0.2?'good':gini<0.4?'warn':'bad')}
  </div>

  <div class="card" style="margin-top:24px">
    <div class="card-head">
      <div><h3>By presenter</h3><p>Sorted by who is furthest below their fair share.</p></div>
      <span class="small muted" tabindex="0" data-tip="Balance index = (their share of deliverables) ÷ (their share of total capacity weight). 1.00 is exactly fair. Hover any row for the numbers behind it." style="cursor:help">ⓘ How this is calculated</span>
    </div>
    <div class="card-body flush" style="border-top:1px solid hsl(var(--border))">
      ${computed.map(r => { const p = presenter(r.id); const [cls,txt] = label[r.status];
        return `
        <div style="padding:16px 20px;border-bottom:1px solid hsl(var(--border))">
          <div style="display:flex;gap:12px;align-items:center">
            ${avatar(p.name)}
            <div style="flex:1;min-width:0">
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                <a href="#" onclick="go('presenter','${p.id}');return false" style="font-weight:500;color:inherit">${p.name}</a>
                ${r.weight!==1?`<span class="badge tabular" data-tip="Capacity weight — their share is scaled by this before comparison." tabindex="0">${r.weight.toFixed(2)}×</span>`:''}
                <span class="badge ${cls}">${txt}</span>
              </div>
              <div class="bar">
                <span style="width:${Math.min(100,(r.bi??0)/2*100)}%;background:${tone[r.status]}"></span>
                <span class="mark"></span>
              </div>
              <p class="small muted" style="margin-top:6px">
                ${r.delivered} of ${totalD} deliverables (${Math.round(r.actual*100)}% received vs ${Math.round(r.expected*100)}% expected)
                ${r.status==='UNDER'&&r.toParity?` · <strong style="color:hsl(var(--warning))">${r.toParity} more would reach parity</strong>`:''}
              </p>
            </div>
            <div style="display:flex;gap:24px;text-align:right">
              <div><div class="small muted" style="text-transform:uppercase;letter-spacing:.04em">Balance</div>
                <div class="tabular" style="font-weight:600;cursor:help" tabindex="0"
                  data-tip="${(r.actual*100).toFixed(1)}% received ÷ ${(r.expected*100).toFixed(1)}% expected = ${r.bi?.toFixed(2)}">${r.bi?.toFixed(2)??'—'}</div></div>
              <div style="width:60px"><div class="small muted" style="text-transform:uppercase;letter-spacing:.04em">Active</div>
                <div class="tabular" style="font-weight:600">${p.active}</div></div>
              <div style="width:74px"><div class="small muted" style="text-transform:uppercase;letter-spacing:.04em">Earned</div>
                <div class="tabular" style="font-weight:600">${money(r.earned,true)}</div></div>
              <div style="width:96px"><div class="small muted" style="text-transform:uppercase;letter-spacing:.04em">Last assigned</div>
                <div>${p.last}</div></div>
            </div>
            <button class="btn btn-outline btn-sm" onclick="go('assignment-new')">Assign</button>
          </div>
          <p class="small muted" style="margin-top:8px;padding-left:52px">
            Against their own target of ${p.target}/month:
            <strong style="color:${r.delivered/p.target>=0.9?'hsl(var(--success))':'hsl(var(--warning))'}">${Math.round(r.delivered/p.target*100)}%</strong></p>
        </div>`;
      }).join('')}
    </div>
  </div>

  <p class="small muted" style="margin-top:14px">Counted from the date work was assigned, not completed — the question this screen answers is what we handed out, which is the part we control. Cancelled and declined assignments are excluded.</p>`;
}

/* ===========================================================================
   COMBOBOX — the "just type the website" control
   =========================================================================== */
const COMBO_OPTIONS = {
  brand: BRANDS.map(b => ({name:b.name, color:b.color})),
  'work type': ['Talking head','Voiceover','Course module','Social short','Product demo','Webinar'].map(n => ({name:n})),
  tag: ['on-camera','voice only','owns studio','finance','technology','education','RP accent','autocue','BSL'].map(n => ({name:n})),
};
const comboState = {};

function combobox(id, placeholder, kind){
  const s = comboState[id] || (comboState[id] = {open:false, query:'', value:null, kind});
  const opts = COMBO_OPTIONS[kind] || [];
  const q = s.query.trim().toLowerCase();
  const filtered = q ? opts.filter(o => o.name.toLowerCase().includes(q)) : opts;
  const exact = opts.some(o => o.name.toLowerCase() === q);
  const showCreate = q.length > 0 && !exact;

  return `<div class="combo" id="${id}">
    <button type="button" class="combo-trigger" onclick="toggleCombo('${id}')" aria-expanded="${s.open}">
      ${s.value
        ? `<span style="display:flex;align-items:center;gap:8px;min-width:0">
             ${s.value.color?`<span style="width:9px;height:9px;border-radius:999px;background:${s.value.color}"></span>`:''}
             <span class="truncate">${esc(s.value.name)}</span>
             ${s.value.isNew?'<span class="badge badge-primary">new</span>':''}</span>`
        : `<span class="muted">${placeholder}</span>`}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15" class="muted"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg>
    </button>
    ${s.open ? `<div class="combo-pop">
      <input id="${id}-input" value="${esc(s.query)}" placeholder="${placeholder}" autocomplete="off"
        oninput="comboState['${id}'].query=this.value;renderCombo('${id}')" />
      <div class="combo-list">
        ${filtered.map(o => `<div class="combo-item" onmousedown="pickCombo('${id}','${esc(o.name)}',${o.color?`'${o.color}'`:'null'},false)">
          ${o.color?`<span style="width:9px;height:9px;border-radius:999px;background:${o.color}"></span>`:''}
          <span style="flex:1">${esc(o.name)}</span></div>`).join('')}
        ${showCreate ? `
          ${filtered.length?'<div style="border-top:1px solid hsl(var(--border));margin:4px 0"></div>':''}
          <div class="combo-item" onmousedown="pickCombo('${id}','${esc(s.query.trim())}',null,true)">
            <svg viewBox="0 0 24 24" fill="none" stroke="hsl(var(--primary))" stroke-width="2" width="15" height="15"><path d="M12 5v14M5 12h14"/></svg>
            <span>Create ${kind} <strong>“${esc(s.query.trim())}”</strong></span></div>
          ${filtered.length?`<p class="combo-note">${filtered.length} existing ${kind}${filtered.length>1?'s':''} match — check the list before adding a new one.</p>`:''}
        ` : ''}
        ${!filtered.length && !showCreate ? `<p class="combo-note" style="padding:18px;text-align:center">No ${kind}s yet — start typing to add the first one.</p>` : ''}
      </div>
    </div>` : ''}
  </div>`;
}

function toggleCombo(id){
  const s = comboState[id];
  Object.keys(comboState).forEach(k => { if (k !== id) comboState[k].open = false; });
  s.open = !s.open; s.query = '';
  render();
  if (s.open) setTimeout(() => document.getElementById(id+'-input')?.focus(), 0);
}
function renderCombo(id){
  const el = document.getElementById(id);
  const s = comboState[id];
  const placeholder = el.querySelector('.combo-trigger .muted')?.textContent || '';
  el.outerHTML = combobox(id, placeholder, s.kind);
  setTimeout(() => {
    const input = document.getElementById(id+'-input');
    if (input){ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }, 0);
}
function pickCombo(id, name, color, isNew){
  const s = comboState[id];
  s.value = {name, color, isNew}; s.open = false; s.query = '';
  render();
}
document.addEventListener('click', e => {
  if (!e.target.closest('.combo')){
    let changed = false;
    Object.values(comboState).forEach(s => { if (s.open){ s.open = false; changed = true; } });
    if (changed) render();
  }
});

/* ===========================================================================
   COMMAND PALETTE + THEME
   =========================================================================== */
function openPalette(){
  document.getElementById('overlay').classList.add('open');
  document.getElementById('palette').classList.add('open');
  const input = document.getElementById('paletteInput');
  input.value = ''; renderPalette(''); setTimeout(() => input.focus(), 0);
}
function closePalette(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('palette').classList.remove('open');
}
function renderPalette(q){
  const query = q.trim().toLowerCase();
  const people = query ? PRESENTERS.filter(p => p.name.toLowerCase().includes(query)) : [];
  const jobs = query ? JOBS.filter(j => (j.title+j.ref).toLowerCase().includes(query)) : [];
  document.getElementById('paletteList').innerHTML = `
    ${people.length||jobs.length ? `<div class="palette-group">Results</div>
      ${people.map(p => `<div class="palette-item" onclick="closePalette();go('presenter','${p.id}')">
        ${avatar(p.name,'xs')}<span style="flex:1">${p.name}</span><span class="badge">${p.brands.map(b=>brand(b).name).join(', ')}</span></div>`).join('')}
      ${jobs.map(j => `<div class="palette-item" onclick="closePalette();go('assignment','${j.ref}')">
        <span style="flex:1">${j.ref} — ${esc(j.title)}</span><span class="badge">${j.p?presenter(j.p).name:'Unassigned'}</span></div>`).join('')}`
    : ''}
    <div class="palette-group">Go to</div>
    ${NAV.map(n => `<div class="palette-item" onclick="closePalette();go('${n.id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="15" height="15"><path d="${n.icon}"/></svg>${n.label}</div>`).join('')}
    <div class="palette-group">Create</div>
    <div class="palette-item" onclick="closePalette();go('assignment-new')">＋ New assignment</div>
    <div class="palette-item" onclick="closePalette();go('presenter-new')">＋ New presenter profile</div>`;
}
document.getElementById('paletteInput').addEventListener('input', e => renderPalette(e.target.value));

document.addEventListener('keydown', e => {
  const typing = ['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName);
  if (e.key === 'k' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); openPalette(); }
  if (e.key === '/' && !typing){ e.preventDefault(); openPalette(); }
  if (e.key === 'Escape') closePalette();
});

function toggleTheme(){
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
}

render();
</script>
